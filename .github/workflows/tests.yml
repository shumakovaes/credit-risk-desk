name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: creditdesk
          POSTGRES_PASSWORD: creditdesk
          POSTGRES_DB: creditdesk_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U creditdesk -d creditdesk_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://creditdesk:creditdesk@localhost:5432/creditdesk_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.lock
      - run: pip install -r requirements.lock
      - run: pip install --no-deps -e .
      - run: pytest -q
